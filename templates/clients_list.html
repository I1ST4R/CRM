<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Клиенты</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Клиенты</h1>
        <a href="/" class="btn btn-secondary mb-3">На главную</a>
        <a href="/core/clients/add/" class="btn btn-success mb-3 ml-2">Добавить клиента</a>
        <div class="card shadow">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="thead-dark">
                        <tr>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Телефон</th>
                            <th>Адрес</th>
                            <th>Дата создания</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for client in clients %}
                        <tr>
                            <td>{{ client.name }}</td>
                            <td>{{ client.email }}</td>
                            <td>{{ client.phone }}</td>
                            <td>{{ client.address }}</td>
                            <td>{{ client.created_at|date:'d.m.Y H:i' }}</td>
                            <td>
                                <a href="/core/clients/{{ client.id }}/edit/" class="btn btn-sm btn-primary">Изменить</a>
                                <a href="/core/clients/{{ client.id }}/delete/" class="btn btn-sm btn-danger">Удалить</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="6" class="text-center">Нет клиентов</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
