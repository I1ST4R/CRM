{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="mb-4 text-center">{% if action == 'add' %}Добавить товар{% else %}Редактировать товар{% endif %}</h2>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        <div class="form-group">
                            <label for="id_name">Название</label>
                            <input type="text" name="name" class="form-control" id="id_name" value="{{ form.name.value|default_if_none:'' }}">
                            {{ form.name.errors }}
                        </div>
                        <div class="form-group">
                            <label for="id_description">Описание</label>
                            <textarea name="description" class="form-control" id="id_description">{{ form.description.value|default_if_none:'' }}</textarea>
                            {{ form.description.errors }}
                        </div>
                        <div class="form-group">
                            <label for="id_price">Цена</label>
                            <input type="number" step="0.01" name="price" class="form-control" id="id_price" value="{{ form.price.value|default_if_none:'' }}">
                            {{ form.price.errors }}
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
                        <a href="{% url 'products_list' %}" class="btn btn-secondary btn-block mt-2">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
