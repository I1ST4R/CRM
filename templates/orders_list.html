<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Заказы</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Заказы</h1>
        <a href="/" class="btn btn-secondary mb-3">На главную</a>
        <a href="/core/orders/add/" class="btn btn-success mb-3 ml-2">Добавить заказ</a>
        <div class="card shadow">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="thead-dark">
                        <tr>
                            <th>Номер заказа</th>
                            <th>Клиент</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Сумма</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for order in orders %}
                        <tr>
                            <td>{{ order.id }}</td>
                            <td>{{ order.client.name }}</td>
                            <td>{{ order.date|date:'d.m.Y' }}</td>
                            <td>{{ order.get_status_display }}</td>
                            <td>{{ order.total_amount }}</td>
                            <td>
                                <a href="/core/orders/{{ order.id }}/edit/" class="btn btn-sm btn-primary">Изменить</a>
                                <a href="/core/orders/{{ order.id }}/delete/" class="btn btn-sm btn-danger">Удалить</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="6" class="text-center">Нет заказов</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
