{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="mb-4 text-center">Вход в CRM</h2>
                    {% if form.errors %}
                        <div class="alert alert-danger">Неверный логин или пароль</div>
                    {% endif %}
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_username">Логин</label>
                            <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="id_password">Пароль</label>
                            <input type="password" name="password" class="form-control" id="id_password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
